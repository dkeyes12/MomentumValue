[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "momentum-value-dashboard"
version = "1.0.0"
description = "Financial dashboard for Momentum + Value portfolio optimization using Linear Programming."
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = {text = "MIT"}
authors = [
  {name = "MomentumValue", email = "user@example.com"}
]

dependencies = [
    "streamlit>=1.30.0",
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "ortools>=9.8.0",
    "scipy>=1.11.0",
    # Skfolio and Cvxpy are pinned to ensure compatibility
    "cvxpy>=1.4.2,<1.6.0",
    "skfolio>=0.1.3"
]

[tool.setuptools.packages.find]
where = ["."]  # Scans current directory for python modules
include = ["*"]